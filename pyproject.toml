[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uavplan"
version = "0.1.0"
description = "UAV mission planner: no-fly-zone avoidance, tour optimisation, battery-limited sorties"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
uavplan = "uavplan.cli:main"

[tool.setuptools]
packages = ["uavplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
